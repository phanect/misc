name: GitHub Actions

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  test:
    name: test (Node.js v${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node-version:
          - 22
          - 24
          - 26
    env:
      # Override Node.js version over mise.toml
      NODE_VERSION: ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0.6.4.0.1
        with:
          install: true
          cache: true

      - run: mise test

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0.6.4.0.1
        with:
          install: true
          cache: true

      # You don't have to run `mise build` because
      # `mise lint` runs `mise build` before test and lint.
      - run: mise lint

      - name: Quick test for mise tasks - mise release:readme
        run: mise release:readme
      - name: Quick test for mise tasks - mise versions
        run: mise versions

  publish:
    needs:
      - test
      - lint
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm's Trusted Publishing
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0.6.4.0.1
        with:
          install: true
          cache: true

      - run: mise release
